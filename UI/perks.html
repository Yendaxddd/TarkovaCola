<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarkova-Cola · Augments</title>
<style>
  :root{
    --bg:#060c13; --panel:rgba(12,24,36,.88); --panel2:rgba(18,34,50,.9);
    --line:rgba(120,190,225,.22); --line2:rgba(120,190,225,.45);
    --text:#e3edf4; --dim:#7d92a4; --green:#4be27c;
    /* clases: mejora principal / mejora secundaria / desventaja principal / desventaja secundaria / especial */
    --c-am:#f0c14b; --c-an:#4fd8ff; --c-dm:#ff4d4d; --c-dn:#ff5fc0; --c-sp:#4be27c;
  }
  .c-am{--c:var(--c-am);--rot:-80deg} .c-an{--c:var(--c-an);--rot:40deg}
  .c-dm{--c:var(--c-dm);--rot:220deg}  .c-dn{--c:var(--c-dn);--rot:190deg} .c-sp{--c:var(--c-sp);--rot:0deg}

  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(12px,.95vw,18px)}
  body{
    min-height:100vh; color:var(--text); overflow:hidden;
    font-family:Bahnschrift,"Segoe UI","Arial Narrow",Arial,sans-serif; letter-spacing:.02em;
    background:
      radial-gradient(60% 55% at 85% 62%, rgba(60,220,110,.16), transparent 70%),
      radial-gradient(70% 60% at 20% 20%, rgba(30,90,130,.35), transparent 70%),
      linear-gradient(rgba(79,216,255,.05) 1px, transparent 1px) 0 0/48px 48px,
      linear-gradient(90deg, rgba(79,216,255,.05) 1px, transparent 1px) 0 0/48px 48px,
      var(--bg);
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
  img{display:block}
  .app{height:100vh;display:grid;grid-template-rows:auto 1fr;padding:1.4rem 2.2rem 1.6rem}

  /* ---------- cabecera ---------- */
  header{display:flex;align-items:center;gap:2rem;margin-bottom:1.2rem}
  .title small{display:block;font-size:.7rem;color:var(--dim);letter-spacing:.18em}
  .title h1{font-size:2.1rem;line-height:1;letter-spacing:.06em}
  nav{display:flex;gap:2.4rem;margin:0 auto}
  nav button{padding:.5rem .1rem;font-size:1rem;color:var(--dim);letter-spacing:.1em;border-bottom:2px solid transparent}
  nav button.on{color:var(--text);border-color:var(--c-an)}
  .chips{display:flex;align-items:center;gap:1rem}
  .chip{display:flex;align-items:center;gap:.5rem;padding:.35rem .8rem;border:1px solid var(--line);background:var(--panel);font-size:1rem;letter-spacing:.08em}
  .chip b{color:var(--green)}
  .xbtn{width:2.2rem;height:2.2rem;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel)}
  .xbtn:hover{border-color:var(--c-dm);color:var(--c-dm)}
  .xbtn svg{width:1.1rem;height:1.1rem}

  /* ---------- cuerpo ---------- */
  main{display:grid;grid-template-columns:17rem 1fr;gap:1.6rem;min-height:0}
  .list{display:flex;flex-direction:column;gap:.6rem;overflow:auto}
  .perk{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border:1px solid var(--line);background:var(--panel);font-size:.95rem;letter-spacing:.08em}
  .perk img{width:2.2rem;height:2.2rem;flex:none}
  .perk span{flex:1}
  .perk .pct{flex:none;color:var(--dim);font-size:.8rem}
  .perk.on{background:linear-gradient(90deg,#1f8a4c,#0f4a2a);border-color:#6df0a0}
  .perk.on .pct{color:#eafff1}

  .stage{display:flex;flex-direction:column;min-height:0;min-width:0}
  .head{display:flex;gap:1.2rem;align-items:center;margin-bottom:1rem}
  .head>img{width:5.4rem;height:5.4rem;flex:none;border:2px solid var(--line2);box-shadow:0 0 22px rgba(75,226,124,.25)}
  .head .txt{flex:1;min-width:0}
  .head h2{font-size:2.6rem;line-height:1;letter-spacing:.05em}
  .head p{opacity:.85;max-width:52rem;margin-top:.3rem;font-size:.95rem}
  .xp{margin-top:.7rem;max-width:34rem}
  .xp .row{display:flex;justify-content:space-between;font-size:.75rem;letter-spacing:.12em;color:var(--dim);margin-bottom:.25rem}
  .xp .row b{color:var(--green);font-size:.9rem}
  .bar{height:.55rem;background:rgba(255,255,255,.08);border:1px solid var(--line);position:relative}
  .bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#1fae5d,#7dffb0);box-shadow:0 0 10px rgba(75,226,124,.6)}
  .eqbtn{flex:none;align-self:flex-start;padding:.55rem 1rem;border:1px solid var(--line2);background:var(--panel);font-size:.8rem;letter-spacing:.1em;text-align:center}
  .eqbtn small{display:block;color:var(--dim);font-size:.66rem;margin-top:.15rem}
  .eqbtn.on{border-color:var(--green);background:rgba(75,226,124,.12)}
  .eqbtn.on small{color:var(--green)}

  /* ---------- badge (icono con anillo de color por clase) ---------- */
  .badge{position:relative;display:grid;place-items:center;flex:none;width:4.2rem;height:4.2rem;background:var(--c);transition:.15s}
  .badge::after{content:"";position:absolute;inset:3px;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 40%,#13222f),#09131c)}
  .badge.major{width:4.8rem;height:4.8rem;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
  .badge.major::after{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);inset:0;transform:scale(.93)}
  .badge.minor,.badge.minor::after,.badge.special,.badge.special::after{border-radius:50%}
  .badge img{position:relative;z-index:1;width:58%;height:58%;filter:hue-rotate(var(--rot)) saturate(1.1)}
  .badge .plus{position:relative;z-index:1;font-size:1.6rem;font-weight:700;color:var(--c);letter-spacing:-.05em}
  .badge.sm{width:2.9rem;height:2.9rem} .badge.sm.major{width:3.2rem;height:3.2rem}
  .badge.sm .plus{font-size:1.1rem}

  /* ---------- progreso: camino en serpiente ---------- */
  .tree{position:relative;border:1px solid var(--line);background:var(--panel);padding:1.4rem 2rem;flex:1;min-height:0;overflow:auto}
  .grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem 2rem;max-width:62rem;margin:0 auto}
  svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  svg.links line{stroke:var(--line2);stroke-width:3}
  svg.links line.on{stroke:var(--green)}
  .node{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.35rem;padding:.4rem .5rem;z-index:1}
  .node h4,.node p,.node .st,.node .unl{background:#0b1621}   /* fondo sólido: las líneas pasan por detrás del texto */
  .node h4{font-size:.95rem;letter-spacing:.06em}
  .node p{font-size:.78rem;color:var(--dim);line-height:1.25}
  .node .unl{font-size:.7rem;color:var(--c-dm);letter-spacing:.03em}
  .node .st{font-size:.72rem;letter-spacing:.1em;color:var(--dim)}
  .node.st-done .st{color:var(--green)}
  .node.st-active .st{color:var(--c-am)}
  .st-locked .badge{filter:grayscale(1) brightness(.5)}
  .st-active .badge{animation:pulse 1.8s infinite}
  @keyframes pulse{50%{filter:drop-shadow(0 0 9px var(--c))}}
  .st-done .badge{filter:drop-shadow(0 0 8px var(--c))}
  .node:hover .badge{transform:scale(1.07)}
  .node.sel h4{color:var(--c-an)}
  .node.sel .badge{outline:2px solid #fff;outline-offset:4px}
  .node .lock{position:absolute;top:.3rem;left:.5rem;width:.9rem;height:.9rem;color:var(--dim)}
  .mini{width:5.5rem;height:.32rem;background:rgba(255,255,255,.1);position:relative}
  .mini i{position:absolute;inset:0 auto 0 0;background:var(--c-am)}

  .info{margin-top:.9rem;display:flex;align-items:center;gap:1.2rem;border:1px solid var(--line);background:var(--panel2);padding:.8rem 1.2rem;min-height:6rem}
  .info .k{font-size:.7rem;color:var(--dim);letter-spacing:.14em}
  .info h3{font-size:1.25rem;letter-spacing:.05em}
  .info p{font-size:.88rem;opacity:.9;margin-top:.15rem}
  .info .chal{color:var(--c-am)}
  .info .pb{margin-top:.4rem;max-width:26rem}
  .info .pb .bar i{background:linear-gradient(90deg,#c89a2c,var(--c-am));box-shadow:0 0 8px rgba(240,193,75,.5)}
  .info .pb span{display:block;font-size:.7rem;letter-spacing:.1em;color:var(--dim);margin-top:.2rem}
  .info .go{margin-left:auto;padding:.6rem 1.2rem;border:1px dashed var(--line2);color:var(--dim);font-size:.75rem;letter-spacing:.08em;text-align:center}
  .info .go:hover:not(:disabled){border-color:var(--c-am);color:var(--c-am)}
  .info .go:disabled{opacity:.4;cursor:not-allowed}

  /* ---------- equipar: cuadricula ---------- */
  .equip{display:grid;grid-template-columns:minmax(0,1fr) 22rem;gap:1.4rem;flex:1;min-height:0}
  .col{border:1px solid var(--line);background:var(--panel);padding:1.1rem 1.2rem;overflow:auto;min-height:0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem}
  @media (max-width:1250px){.two{grid-template-columns:1fr}.equip{grid-template-columns:1fr}}
  .sec{display:flex;align-items:center;gap:.6rem;font-size:.8rem;letter-spacing:.14em;margin:.2rem 0 .6rem;padding-bottom:.35rem;border-bottom:2px solid var(--c);color:var(--c)}
  .sec i{width:.7rem;height:.7rem;background:var(--c);display:inline-block}
  .sec.gap{margin-top:1.2rem}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
  .tiles.minor{grid-template-columns:repeat(2,minmax(0,1fr))}
  #toast{position:fixed;left:50%;bottom:2.2rem;transform:translate(-50%,1rem);opacity:0;pointer-events:none;transition:.25s;
    padding:.7rem 1.2rem;background:#3a1210;border:1px solid var(--c-dm);color:#ffd9d5;font-size:.9rem;letter-spacing:.04em;z-index:9}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .tile{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.35rem;padding:1rem .5rem .7rem;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:var(--panel2);min-height:9.6rem}
  .tile:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel2))}
  .tile h5{font-size:.82rem;letter-spacing:.05em;margin-top:.15rem}
  .tile p{font-size:.7rem;color:var(--dim);line-height:1.2}
  .tile .tag{position:absolute;top:0;right:0;font-size:.58rem;padding:.12rem .45rem;letter-spacing:.08em;background:#3a4652;color:#c9d6e0}
  .tile.equipped{background:color-mix(in srgb,var(--c) 22%,var(--panel2));border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent)}
  .tile.equipped .tag{background:var(--c);color:#111}
  .tile.locked .badge{filter:grayscale(1) brightness(.5)}
  .tile.locked{opacity:.8;border-color:var(--line)}
  .tile.flash{animation:flash .5s}
  @keyframes flash{30%{border-color:#fff;background:rgba(255,255,255,.16)}}

  .right h3{font-size:1.7rem;line-height:1;letter-spacing:.04em;color:var(--green)}
  .right .sub{font-size:.82rem;opacity:.8;margin:.4rem 0 .8rem;line-height:1.35}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.4rem}
  .slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;height:7.4rem;padding:.4rem;text-align:center;font-size:.68rem;letter-spacing:.06em;
    border:1px dashed color-mix(in srgb,var(--c) 60%,transparent);color:var(--dim);background:rgba(255,255,255,.02)}
  .slot .plus{font-size:1.8rem;line-height:1;color:var(--c);opacity:.7}
  .slot.full{border:1px solid var(--c);color:var(--text);background:color-mix(in srgb,var(--c) 14%,var(--panel2))}
  .slot.full:hover{background:color-mix(in srgb,var(--c) 26%,var(--panel2))}
  .slot.off{opacity:.45;border-style:dotted}
  .slot em{font-style:normal;font-size:.6rem;color:var(--c);letter-spacing:.1em}
  .summary{margin-top:1rem;padding:.8rem 1rem;border:1px solid var(--line);background:var(--panel2)}
  .summary .r{display:flex;justify-content:space-between;font-size:.78rem;color:var(--dim);letter-spacing:.06em;padding:.12rem 0}
  .summary .tot{display:flex;justify-content:space-between;align-items:center;margin-top:.4rem;padding-top:.5rem;border-top:1px solid var(--line)}
  .summary b{font-size:1.6rem;color:var(--c-am)}
  .summary small{font-size:.66rem;color:var(--dim);letter-spacing:.12em}

  /* ---------- animaciones ---------- */
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes grow{from{width:0}}
  @keyframes draw{to{stroke-dashoffset:0}}
  .app{animation:fadeIn .55s ease-out}
  .anim .head,.anim .tree,.anim .info,.anim .col{animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) both}
  .anim .tree,.anim .col:first-child{animation-delay:.12s}
  .anim .info,.anim .col:last-child{animation-delay:.22s}
  .anim .node,.anim .tile,.anim .slot,.anim .sec{animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.2s + var(--i,0) * 55ms)}
  .anim .bar i,.anim .mini i{animation:grow 1s cubic-bezier(.2,.7,.2,1) .3s both}
  .anim svg.links line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease-out both;animation-delay:calc(.35s + var(--i,0) * 90ms)}
  .perk{animation:fadeIn .5s both}
  .tile,.node .badge,.slot,.perk,.eqbtn,.info .go{transition:transform .18s, border-color .18s, background .18s, box-shadow .18s, filter .18s}
  .tile:hover{transform:translateY(-3px)}
  .slot.full:hover{transform:translateY(-2px)}
  .eqbtn:hover{border-color:var(--green)}
  #toast{transition:opacity .3s, transform .3s}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .dev{position:fixed;right:.8rem;bottom:.6rem;display:flex;gap:.5rem;font-size:.7rem;opacity:.75}
  .dev button{padding:.25rem .6rem;border:1px solid var(--line);background:var(--panel)}
  .dev button:hover{border-color:var(--c-am)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-lock" viewBox="0 0 24 24"><path fill="currentColor" d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9zm-8 0V7a3 3 0 0 1 6 0v2z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" d="m5 5 14 14M19 5 5 19"/></symbol>
</svg>

<div class="app">
  <header>
    <div class="title"><small>AUGMENTS</small><h1 id="ttl">PROGRESS</h1></div>
    <nav>
      <button id="nav-progress">PROGRESO</button>
      <button id="nav-equip">EQUIPAR</button>
    </nav>
    <div class="chips">
      <div class="chip">NIVEL <b id="lvChip">1</b></div>
      <button class="xbtn" id="close" title="Cerrar"><svg><use href="#i-x"/></svg></button>
    </div>
  </header>
  <main>
    <div class="list" id="perkList"></div>
    <section class="stage" id="stage"></section>
  </main>
</div>

<div id="toast"></div>
<div class="dev">
  <button id="dev-xp">+100 XP (demo)</button>
  <button id="dev-reset">REINICIAR (demo)</button>
</div>

// Posición (col,row) de cada paso del camino en serpiente 3x3
const SNAKE = {1:[0,0],2:[1,0],3:[2,0],4:[2,1],5:[1,1],6:[0,1],7:[0,2],8:[1,2],9:[2,2]};

// curva de nivel de ejemplo: el nivel L necesita 300 + 150*L de XP
const need = L => 300 + 150*L;
function levelOf(total){ let L=1, x=total; while(x>=need(L)){ x-=need(L); L++; } return {L, cur:x, max:need(L)}; }

/* ============================================================
   ESTADO
   ============================================================ */
const KEY = 'tarkovacola.ui.v4';
const fresh = () => ({ perk:'speedcola', view:'progress', sel:null, xp:{}, prog:{}, researched:{}, equipped:{}, on:{} });
let S = load();
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return Object.assign(fresh(), JSON.parse(raw)); }catch(e){}
  return fresh();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  // Puente con el juego (WebOverlay): avisa del cambio si la página vive dentro del overlay.
  try{ if(window.chrome && window.chrome.webview) window.chrome.webview.postMessage(JSON.stringify({type:'state', state:S})); }catch(e){}
}
try{ if(window.chrome && window.chrome.webview) window.chrome.webview.addEventListener('message', e=>{
  try{ const m = JSON.parse(e.data); if(m.type==='load'){ S = Object.assign(fresh(), m.state); ANIM = true; render(); } }catch(_){}
}); }catch(e){}
const IN_GAME = !!(window.chrome && window.chrome.webview);   // dentro del WebOverlay del juego

const $ = s => document.querySelector(s);
const perk = () => PERKS.find(p=>p.id===S.perk);
const done = id => !!(S.researched[S.perk] && S.researched[S.perk][id]);
const progOf = id => (S.prog[S.perk] && S.prog[S.perk][id]) || 0;
const level = () => levelOf(S.xp[S.perk]||0).L;
const perkOn = () => S.on[S.perk] !== false;
const eq = () => (S.equipped[S.perk] = S.equipped[S.perk] || {aug:{major:null,minor:[]}, drb:{major:null,minor:[]}});
const cls = (branch,kind) => kind==='special' ? 'c-sp' : 'c-' + (branch==='aug'?'a':'d') + (kind==='major'?'m':'n');
const minorSlots = () => ({ aug: done('s_slot') ? 2 : 1, drb: 1 });

// nodos del camino (mejoras + Extra Slot)
function nodes(){
  const p = perk();
  return [...p.aug.major.map(it=>({it,kind:'major'})), ...p.aug.minor.map(it=>({it,kind:'minor'})), {it:p.special,kind:'special'}]
         .map(n=>({...n, pos:SNAKE[n.it.seq]}));
}
const nodeById = id => nodes().find(n=>n.it.id===id);
function find(id){ const p=perk(); for(const b of ['aug','drb']) for(const k of ['major','minor']){ const i=p[b][k].findIndex(x=>x.id===id); if(i>=0) return {it:p[b][k][i],branch:b,kind:k,idx:i}; } }
const pairOf = f => { const p=perk(), o = f.branch==='aug'?'drb':'aug'; return {it:p[o][f.kind][f.idx], branch:o, kind:f.kind, idx:f.idx}; };
// una mejora está disponible si su desafío está completo; una desventaja, si lo está su mejora pareja
const unlocked = id => { const f=find(id); return f.branch==='aug' ? done(id) : done(pairOf(f).it.id); };
// estado de un nodo: locked (nivel insuficiente) / active (desafío en curso) / done
const stateOf = n => done(n.it.id) ? 'done' : level() >= n.it.lvl ? 'active' : 'locked';
const pct = p => { const r=S.researched[p.id]||{}; const all=[...p.aug.major,...p.aug.minor,p.special]; return Math.round(all.filter(x=>r[x.id]).length/all.length*100); };

const badge = (branch,kind,sm) => `<div class="badge ${cls(branch,kind)} ${kind} ${sm?'sm':''}">${kind==='special'?'<span class="plus">＋2</span>':`<img src="${ICON}" alt="">`}</div>`;

function render(){
  const p = perk(), lv = levelOf(S.xp[p.id]||0);
  $('#lvChip').textContent = lv.L;
  $('#ttl').textContent = S.view==='progress' ? 'PROGRESS' : 'EQUIP';
  $('#nav-progress').classList.toggle('on', S.view==='progress');
  $('#nav-equip').classList.toggle('on', S.view==='equip');

  $('#perkList').innerHTML = PERKS.map(x=>`
    <button class="perk ${x.id===S.perk?'on':''}" data-perk="${x.id}"><img src="${x.icon}" alt=""><span>${x.name}</span><span class="pct">${pct(x)}%</span></button>`).join('');

  const head = `<div class="head"><img src="${p.icon}" alt="">
     <div class="txt"><h2>${p.name}</h2><p>${p.desc}</p>
       <div class="xp"><div class="row"><span>NIVEL <b>${lv.L}</b></span><span>${lv.cur} / ${lv.max} XP</span></div>
       <div class="bar"><i style="width:${Math.round(lv.cur/lv.max*100)}%"></i></div></div></div>
     <button class="eqbtn ${perkOn()?'on':''}" data-toggleperk="1">${perkOn()?'PERK EQUIPADA':'NO EQUIPADA'}<small>${perkOn()?'+25% XP':'sin bonus de XP'}</small></button></div>`;
  _i = 0;
  $('#stage').classList.toggle('anim', ANIM);          // las animaciones de entrada solo al abrir / cambiar de pantalla
  $('#stage').innerHTML = head + (S.view==='progress' ? progressView() : equipView());
  if(S.view==='progress') requestAnimationFrame(drawLinks);
  ANIM = false;
}
let ANIM = true, _i = 0;
const nx = () => _i++;

function progressView(){
  const list = nodes();
  const cells = list.map(n=>{
    const st = stateOf(n), sel = S.sel===n.it.id, prog = Math.min(progOf(n.it.id), n.it.goal);
    const dr = n.kind==='special' ? null : pairOf(find(n.it.id)).it;
    const status = st==='done' ? '✔ DESBLOQUEADA' : st==='locked' ? `NIVEL ${n.it.lvl}` : `DESAFÍO ${prog}/${n.it.goal}`;
    return `<button class="node ${cls('aug',n.kind)} ${n.kind} st-${st} ${sel?'sel':''}" data-node="${n.it.id}" data-seq="${n.it.seq}"
      style="grid-column:${n.pos[0]+1};grid-row:${n.pos[1]+1};--i:${nx()}">
      ${st==='locked'?'<svg class="lock"><use href="#i-lock"/></svg>':''}
      <h4>${n.it.name}</h4>${badge('aug',n.kind)}
      <p>${n.it.desc}</p>
      ${dr?`<span class="unl">▸ Desbloquea: ${dr.name}</span>`:''}
      <span class="st">${status}</span>
      ${st==='active'?`<span class="mini"><i style="width:${prog/n.it.goal*100}%"></i></span>`:''}</button>`;
  }).join('');

  const cur = S.sel && nodeById(S.sel);
  let info;
  if(cur){
    const st = stateOf(cur), prog = Math.min(progOf(cur.it.id), cur.it.goal);
    const dr = cur.kind==='special' ? null : pairOf(find(cur.it.id)).it;
    const kindTxt = cur.kind==='major' ? 'MEJORA PRINCIPAL' : cur.kind==='minor' ? 'MEJORA SECUNDARIA' : 'DESBLOQUEO ESPECIAL';
    info = `<div style="flex:1"><div class="k">${kindTxt} · DESAFÍO DE NIVEL ${cur.it.lvl}</div>
      <h3>${cur.it.name}</h3><p>${cur.it.desc}</p>
      <p class="chal">${st==='locked' ? `🔒 Alcanza el nivel ${cur.it.lvl} para desbloquear este desafío.` : `Desafío: ${cur.it.chal}`}</p>
      ${st==='active'?`<div class="pb"><div class="bar"><i style="width:${prog/cur.it.goal*100}%"></i></div><span>${prog} / ${cur.it.goal}</span></div>`:''}
      ${dr?`<p style="color:var(--c-dm)">Desbloquea la desventaja <b>${dr.name}</b>: ${dr.desc}</p>`:''}</div>
      <button class="go" data-prog="${cur.it.id}" ${st!=='active'?'disabled':''}>+1 PROGRESO<br>(demo)</button>`;
  } else info = `<div><div class="k">PROGRESO</div><h3>Selecciona un nodo</h3><p>Sube de nivel para revelar desafíos. Al completar uno se desbloquea su mejora y la desventaja ligada.</p></div>`;

  return `<div class="tree"><div class="grid" id="grid">${cells}<svg class="links" id="links"></svg></div></div><div class="info">${info}</div>`;
}

// líneas del camino: une cada paso con el siguiente; se ilumina si el primero ya está desbloqueado
function drawLinks(){
  const g = $('#grid'), svg = $('#links'); if(!g||!svg) return;
  const gr = g.getBoundingClientRect();
  // une cada nodo con el siguiente en orden de "seq" (los huecos del camino quedan como tramos largos)
  const els = [...g.querySelectorAll('.node')].sort((a,b)=>a.dataset.seq-b.dataset.seq);
  let out='';
  for(let i=0;i<els.length-1;i++){
    const a=els[i], b=els[i+1];
    const ra=a.querySelector('.badge').getBoundingClientRect(), rb=b.querySelector('.badge').getBoundingClientRect();
    out += `<line pathLength="1" class="${a.classList.contains('st-done')?'on':''}" style="--i:${i}" x1="${ra.left+ra.width/2-gr.left}" y1="${ra.top+ra.height/2-gr.top}" x2="${rb.left+rb.width/2-gr.left}" y2="${rb.top+rb.height/2-gr.top}"/>`;
  }
  svg.innerHTML = out;
}

function tile(it,branch,kind){
  const ok = unlocked(it.id), on = isEq(it.id), f = find(it.id);
  const hint = ok ? '' : branch==='aug' ? 'NO DESBLOQUEADA' : 'BLOQUEADA';
  const body = ok ? `<p>${it.desc}</p>` : branch==='aug' ? `<p style="color:var(--c-am)">Desafío de nivel ${it.lvl}</p>` : `<p style="color:var(--c-am)">Desbloquea ${pairOf(f).it.name}</p>`;
  const extra = '';
  return `<button class="tile ${cls(branch,kind)} ${ok?'':'locked'} ${on?'equipped':''}" data-equip="${it.id}" style="--i:${nx()}">
    ${on?'<span class="tag">EQUIPADA</span>':hint?`<span class="tag">${hint}</span>`:''}
    ${badge(branch,kind,true)}<h5>${it.name}</h5>${body}${extra}</button>`;
}

function equipView(){
  const p = perk(), e = eq(), N = minorSlots();
  const sec = (label,branch,kind,extra) => `<div class="sec ${cls(branch,kind)} ${extra||''}"><i></i>${label}</div>`;
  const colAug = `${sec('MEJORA PRINCIPAL','aug','major')}<div class="tiles">${p.aug.major.map(i=>tile(i,'aug','major')).join('')}</div>
                  ${sec('MEJORA SECUNDARIA','aug','minor','gap')}<div class="tiles minor">${p.aug.minor.map(i=>tile(i,'aug','minor')).join('')}</div>`;
  const colDrb = `${sec('DESVENTAJA PRINCIPAL','drb','major')}<div class="tiles">${p.drb.major.map(i=>tile(i,'drb','major')).join('')}</div>
                  ${sec('DESVENTAJA SECUNDARIA','drb','minor','gap')}<div class="tiles minor">${p.drb.minor.map(i=>tile(i,'drb','minor')).join('')}</div>`;

  const slot = (id,branch,kind,off) => {
    const f = id && find(id), c = cls(branch,kind), lbl = kind==='major'?'PRINCIPAL':'SECUNDARIA';
    if(off) return `<div class="slot off ${c}"><span class="plus"><svg width="18" height="18"><use href="#i-lock"/></svg></span><em>NIVEL 5</em></div>`;
    return f ? `<button class="slot full ${c}" data-unequip="${id}">${badge(branch,kind,true)}<span>${f.it.name}</span><em>${lbl}</em></button>`
             : `<div class="slot ${c}"><span class="plus">+</span><em>${lbl}</em></div>`;
  };
  const augMinor = Array.from({length:2},(_,i)=> i<N.aug ? slot(e.aug.minor[i],'aug','minor') : slot(null,'aug','minor',true)).join('');
  const drbMinor = Array.from({length:N.drb},(_,i)=> slot(e.drb.minor[i],'drb','minor')).join('');

  const mult = 1 + (perkOn()?PERK_XP_BONUS:0);   // las desventajas no dan XP: se aplican independientemente
  const right = `<div class="right"><h3>${p.name}</h3><div class="sub">Mejoras: 1 principal + ${N.aug} secundaria${N.aug>1?'s':''}.<br>Desventajas: 1 principal + 1 secundaria.<br>No puedes llevar una mejora principal sin su desventaja principal.</div>
    <div class="sec c-am"><i></i>MEJORAS</div>
    <div class="slots">${slot(e.aug.major,'aug','major')}${augMinor}</div>
    <div class="sec c-dm gap"><i></i>DESVENTAJAS</div>
    <div class="slots">${slot(e.drb.major,'drb','major')}${drbMinor}</div>
    <div class="summary">
      <div class="r"><span>Perk equipada</span><span>${perkOn()?'+25%':'—'}</span></div>
      <div class="tot"><small>MULTIPLICADOR DE XP</small><b>x${mult.toFixed(2)}</b></div></div></div>`;
  return `<div class="equip"><div class="col"><div class="two"><div>${colAug}</div><div>${colDrb}</div></div></div><div class="col">${right}</div></div>`;
}

/* ============================================================
   ACCIONES
   ============================================================ */
function isEq(id){ const e=eq(); return [e.aug.major,...e.aug.minor,e.drb.major,...e.drb.minor].includes(id); }
// Devuelve un mensaje de error si la acción no está permitida, o null si se hizo.
function toggleEquip(id){
  const f = find(id); if(!f) return null;
  const E = eq(), e = E[f.branch];
  if(isEq(id)){
    if(e.major===id){
      e.major = null;
      if(f.branch==='drb' && E.aug.major){ E.aug.major = null; toast('Sin desventaja principal, la mejora principal también se desequipa.'); }
    } else e.minor = e.minor.filter(x=>x!==id);
    return null;
  }
  if(f.kind==='major'){
    if(f.branch==='aug' && !E.drb.major) return 'Equipa primero una desventaja principal.';
    e.major = id;
  } else {
    const n = minorSlots()[f.branch];
    e.minor = [...e.minor, id].slice(-n);      // si están llenas, reemplaza la más antigua
  }
  return null;
}
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

function addProgress(id){
  const n = nodeById(id); if(!n || stateOf(n)!=='active') return;
  const P = (S.prog[S.perk] = S.prog[S.perk] || {});
  P[id] = Math.min((P[id]||0)+1, n.it.goal);
  if(P[id] >= n.it.goal){
    (S.researched[S.perk] = S.researched[S.perk] || {})[id] = true;
    const dr = n.kind!=='special' ? pairOf(find(id)).it.name : null;
    toast(`¡Desafío completado! Desbloqueas ${n.it.name}${dr?` y la desventaja ${dr}`:''}.`);
  }
}

document.addEventListener('click', ev=>{
  const t = ev.target.closest('[data-perk],[data-node],[data-prog],[data-toggleperk],[data-equip],[data-unequip],#nav-progress,#nav-equip,#dev-xp,#dev-reset,#close');
  if(!t) return;
  if(t.dataset.perk){ S.perk=t.dataset.perk; S.sel=null; ANIM=true; }
  else if(t.id==='nav-progress'){ if(S.view!=='progress') ANIM=true; S.view='progress'; }
  else if(t.id==='nav-equip'){ if(S.view!=='equip') ANIM=true; S.view='equip'; }
  else if(t.dataset.node){ S.sel=t.dataset.node; }
  else if(t.dataset.prog){ addProgress(t.dataset.prog); }
  else if(t.dataset.toggleperk){ S.on[S.perk] = !perkOn(); }
  else if(t.dataset.equip){
    if(!unlocked(t.dataset.equip)){ t.classList.add('flash'); setTimeout(()=>t.classList.remove('flash'),500); return; }
    const err = toggleEquip(t.dataset.equip);
    if(err){ toast(err); t.classList.add('flash'); setTimeout(()=>t.classList.remove('flash'),500); return; }
  }
  else if(t.dataset.unequip){ toggleEquip(t.dataset.unequip); }
  else if(t.id==='dev-xp'){ const before=level(); S.xp[S.perk]=(S.xp[S.perk]||0)+100; if(level()>before) toast(`¡Nivel ${level()}! Nuevos desafíos disponibles.`); }
  else if(t.id==='dev-reset'){ S=fresh(); }
  else if(t.id==='close'){ try{ window.chrome&&window.chrome.webview&&window.chrome.webview.postMessage(JSON.stringify({type:'close'})); }catch(e){} }
  save(); render();
});
window.addEventListener('resize', ()=>requestAnimationFrame(drawLinks));
if(IN_GAME) document.querySelector('.dev').style.display = 'none';   // los botones de demo no van dentro del juego
render();
</script>
</body>
